name: Windows

# App Windows (desktop/) : tests du cœur Rust, puis installeurs. Lancée par tout changement dans desktop/,
# sur n'importe quelle branche, et à la main (onglet Actions).
on:
  push:
    paths: ["desktop/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Rust (version fixée par desktop/rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Traductions
        working-directory: .
        env:
          PYTHONIOENCODING: utf-8
        run: python desktop/scripts/l10n.py check
      - name: Interface (dépendances et build)
        working-directory: desktop/app
        run: |
          npm ci
          npm run check
          npm run build
      - name: pdfium (couvertures des PDF, livrée avec l'app)
        working-directory: .
        shell: bash
        run: echo "FOLUNA_PDFIUM=$(python desktop/scripts/fetch-pdfium.py windows)" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Build de release dans un dossier à part, hors du cache (qui ne garde que les builds de test).
      - name: Installeurs
        working-directory: desktop/app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target-bundle
          # Numéro du passage affiché dans les réglages (« Foluna 0.1.0 (9) »).
          FOLUNA_BUILD: ${{ github.run_number }}
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: foluna-windows
          # Seulement l'installeur .exe : le .msi est vu par Windows comme un autre programme (double installation).
          path: desktop/target-bundle/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
