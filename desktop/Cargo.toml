# Foluna pour Windows (et plus tard Linux) : cœur sans interface et app Tauri.
[workspace]
members = ["core", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/adnmac/Foluna"

[profile.release]
codegen-units = 1
lto = true
strip = true
