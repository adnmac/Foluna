[package]
name = "foluna-core"
description = "Logique de Foluna sans interface : livres, conversions, bibliothèque, liseuses."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "0.8.44"
lopdf = "0.47"
regex = "1.13"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
lopdf = "0.47"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
