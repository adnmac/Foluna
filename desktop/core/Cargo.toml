[package]
name = "foluna-core"
description = "Logique de Foluna sans interface : livres, conversions, bibliothèque, liseuses."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "0.8.44"
flate2 = "1.1"
html5ever = "0.40"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
markup5ever_rcdom = "0.40.1"
lopdf = "0.47"
pdfium-render = { version = "0.9", default-features = false, features = ["image_025", "thread_safe", "pdfium_8125"] }
regex = "1.13"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
trash = "5.4"
unicode-normalization = "0.1.26"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "json"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
lopdf = "0.47"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
