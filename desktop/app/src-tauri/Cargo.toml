[package]
name = "foluna"
description = "Foluna : bibliothèque de livres chargés sur une liseuse par USB."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Nom distinct de l'exécutable (exigence de Cargo sous Windows).
name = "foluna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
foluna-core = { path = "../../core" }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
